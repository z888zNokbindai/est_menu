<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estella Khaoyai Menu</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght=500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: block;
      background: #ffffff;
      color: #2a2a2a;
      font-family: "Noto Sans Thai", sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* จัดหน้าจอให้อยู่ตรงกลางด้วย Table Layout เพื่อความเสถียรสูงสุดในทุกเบราว์เซอร์ */
    .wrapper {
      display: table;
      width: 100%;
      height: 100vh;
      min-height: 100vh;
    }

    .cell {
      display: table-cell;
      vertical-align: middle;
      text-align: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #e6ece7;
      border-radius: 28px;
      padding: 42px 28px 30px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(20, 45, 32, 0.08);
    }

    /* ควบคุมขนาดโลโก้ ป้องกันสัดส่วนภาพพัง */
    .logo-img {
      max-width: 180px;
      height: auto;
      margin: 0 auto 8px;
      display: block;
    }

    .divider {
      width: 78px;
      height: 2px;
      margin: 18px auto;
      border: 0;
      background: #c8a96b;
    }

    .subtitle-th {
      margin: 0;
      font-size: 1rem;
      font-weight: 500;
      color: #4c5c52;
    }

    .subtitle-en {
      margin: 6px 0 30px;
      font-size: 0.92rem;
      font-weight: 400;
      color: #7b857e;
    }

    .menu-buttons {
      display: block;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 18px 20px;
      margin-bottom: 16px;
      border-radius: 18px;
      text-decoration: none;
      text-align: center;
      color: #ffffff !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .btn:last-child {
      margin-bottom: 0;
    }

    .btn-food {
      background-color: #173d2d !important;
      color: #ffffff !important;
      border: 1px solid #173d2d;
      box-shadow: 0 10px 24px rgba(23, 61, 45, 0.18);
    }

    .btn-drink {
      background-color: #b8965c !important;
      color: #ffffff !important;
      border: 1px solid #b8965c;
      box-shadow: 0 10px 24px rgba(184, 150, 92, 0.20);
    }

    .title-th {
      display: block;
      font-size: 1.08rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .title-en {
      display: block;
      margin-top: 5px;
      font-size: 0.92rem;
      font-weight: 400;
      opacity: 0.95;
      letter-spacing: 0.2px;
    }

    .footer-note {
      margin-top: 24px;
      font-size: 0.88rem;
      color: #8a918c;
    }

    @media (max-width: 480px) {
      .cell {
        padding: 18px;
      }

      .card {
        padding: 34px 20px 24px;
        border-radius: 22px;
      }

      .title-th {
        font-size: 1rem;
      }

      .title-en {
        font-size: 0.86rem;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="cell">
      <div class="card">
        <img src="logo.png" alt="Estella Khaoyai Logo" class="logo-img" />
        
        <div class="divider"></div>

        <p class="subtitle-th">กรุณาเลือกเมนูที่ต้องการ</p>
        <p class="subtitle-en">Please select your preferred menu</p>

        <div class="menu-buttons">
          <a class="btn btn-food" href="https://z888znokbindai.github.io/est_menu/food" id="link-food">
            <span class="title-th">เมนูอาหาร</span>
            <span class="title-en">Food Menu</span>
          </a>

          <a class="btn btn-drink" href="https://z888znokbindai.github.io/est_menu/drink" id="link-drink">
            <span class="title-th">เมนูเครื่องดื่ม</span>
            <span class="title-en">Beverage Menu</span>
          </a>
        </div>

        <div class="footer-note">
          Scan once, choose your menu anytime
        </div>
      </div>
    </div>
  </div>

  <script>
    // ดักฟังพฤติกรรม หากลูกค้ากดปุ่ม Back หรือ Forward ย้อนกลับมาที่หน้านี้ ให้ทำการโหลดหน้าเว็บใหม่จากเซิร์ฟเวอร์ทันที ไม่ใช้หน้าเก่าที่จำไว้ในเครื่อง
    window.addEventListener('pageshow', function (event) {
      if (event.persisted || (typeof window.performance !== 'undefined' && window.performance.navigation.type === 2)) {
        window.location.reload(true);
      }
    });

    // สุ่มเลขพารามิเตอร์ต่อท้ายลิงก์โดยใช้เวลาปัจจุบันเป็นมิลลิวินาที (Timestamp) ทุกครั้งที่หน้าเว็บเปิดขึ้นมา 
    // ตัวอย่างผลลัพธ์: .../food?t=1719912000000 เพื่อบังคับให้หน้าเว็บถัดไปมองว่าเป็น URL ใหม่และต้องดึงข้อมูลใหม่เสมอ
    try {
      var timestamp = new Date().getTime();
      var foodLink = document.getElementById('link-food');
      var drinkLink = document.getElementById('link-drink');
      
      if (foodLink) {
        foodLink.href = "https://z888znokbindai.github.io/est_menu/food?t=" + timestamp;
      }
      if (drinkLink) {
        drinkLink.href = "https://z888znokbindai.github.io/est_menu/drink?t=" + timestamp;
      }
    } catch (e) {
      console.error("Cache buster error:", e);
    }
  </script>
</body>
</html>
