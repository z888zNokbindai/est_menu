<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estella Khaoyai Menu</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --brand: #425217;
      --brand-dark: #34410f;
      --brand-soft: #697052;

      --gold: #b99b60;
      --gold-soft: #d7c69f;

      --ivory: #f7f4ec;
      --paper: #fffdf8;

      --border: rgba(66, 82, 23, 0.25);
      --text: #364018;
      --muted: #7b806d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;

      font-family: "Noto Sans Thai", sans-serif;
      color: var(--text);

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(185, 155, 96, 0.08),
          transparent 38%
        ),
        var(--ivory);

      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* =========================
       Botanical decoration
       ========================= */

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 300px;
      height: 500px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.035;
    }

    body::before {
      left: -150px;
      top: 5%;
      transform: rotate(-15deg);

      background:
        radial-gradient(
          ellipse at 50% 10%,
          var(--brand) 0 8%,
          transparent 9%
        ),
        radial-gradient(
          ellipse at 30% 25%,
          var(--brand) 0 9%,
          transparent 10%
        ),
        radial-gradient(
          ellipse at 68% 36%,
          var(--brand) 0 9%,
          transparent 10%
        ),
        radial-gradient(
          ellipse at 32% 52%,
          var(--brand) 0 10%,
          transparent 11%
        ),
        radial-gradient(
          ellipse at 68% 68%,
          var(--brand) 0 10%,
          transparent 11%
        );
    }

    body::after {
      right: -150px;
      bottom: 0;
      transform: rotate(165deg);

      background:
        radial-gradient(
          ellipse at 50% 10%,
          var(--brand) 0 8%,
          transparent 9%
        ),
        radial-gradient(
          ellipse at 30% 25%,
          var(--brand) 0 9%,
          transparent 10%
        ),
        radial-gradient(
          ellipse at 68% 36%,
          var(--brand) 0 9%,
          transparent 10%
        ),
        radial-gradient(
          ellipse at 32% 52%,
          var(--brand) 0 10%,
          transparent 11%
        ),
        radial-gradient(
          ellipse at 68% 68%,
          var(--brand) 0 10%,
          transparent 11%
        );
    }

    /* =========================
       Layout
       ========================= */

    .wrapper {
      position: relative;
      z-index: 1;

      display: table;
      width: 100%;
      min-height: 100vh;
      height: 100vh;
    }

    .cell {
      display: table-cell;
      vertical-align: middle;
      text-align: center;

      padding: 30px 20px;
    }

    .card {
      position: relative;

      width: 100%;
      max-width: 520px;

      margin: 0 auto;
      padding: 44px 40px 28px;

      background: var(--paper);

      border: 1px solid var(--border);
      border-radius: 28px;

      box-shadow:
        0 28px 70px rgba(43, 54, 18, 0.07),
        0 4px 14px rgba(43, 54, 18, 0.03);
    }

    /* inner border */
    .card::before {
      content: "";
      position: absolute;
      inset: 7px;

      border: 1px solid rgba(185, 155, 96, 0.13);
      border-radius: 21px;

      pointer-events: none;
    }

    /* =========================
       Logo
       ========================= */

    .logo-img {
      position: relative;
      z-index: 1;

      display: block;
      width: 100%;
      max-width: 220px;
      height: auto;

      margin: 0 auto 19px;
    }

    /* =========================
       Divider
       ========================= */

    .divider {
      position: relative;

      width: 75%;
      max-width: 290px;
      height: 1px;

      margin: 0 auto 29px;

      border: 0;

      background:
        linear-gradient(
          90deg,
          transparent 0%,
          var(--gold-soft) 18%,
          var(--gold) 50%,
          var(--gold-soft) 82%,
          transparent 100%
        );
    }

    .divider::after {
      content: "";

      position: absolute;
      left: 50%;
      top: 50%;

      width: 7px;
      height: 7px;

      background: var(--gold);

      transform:
        translate(-50%, -50%)
        rotate(45deg);

      box-shadow:
        0 0 0 6px var(--paper);
    }

    /* =========================
       Subtitle
       ========================= */

    .subtitle-th {
      margin: 0;

      color: var(--brand);

      font-size: 1.04rem;
      font-weight: 500;
      line-height: 1.55;
    }

    .subtitle-en {
      margin: 4px 0 31px;

      color: var(--brand-soft);

      font-family: "Cormorant Garamond", serif;
      font-size: 1.05rem;
      font-weight: 500;

      letter-spacing: 0.25px;
    }

    /* =========================
       Buttons
       ========================= */

    .menu-buttons {
      display: block;
    }

    .btn {
      position: relative;

      display: block;
      width: 100%;

      margin-bottom: 13px;
      padding: 17px 20px;

      background: var(--paper);

      border: 1px solid rgba(66, 82, 23, 0.34);
      border-radius: 15px;

      color: var(--brand) !important;

      text-align: center;
      text-decoration: none;

      transition:
        background 0.18s ease,
        color 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease,
        transform 0.18s ease;

      -webkit-tap-highlight-color: transparent;
    }

    .btn:last-child {
      margin-bottom: 0;
    }

    .btn:hover {
      background: var(--brand);
      border-color: var(--brand);

      transform: translateY(-2px);

      box-shadow:
        0 10px 24px rgba(66, 82, 23, 0.14);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:focus-visible {
      outline: 3px solid rgba(185, 155, 96, 0.35);
      outline-offset: 3px;
    }

    .title-th {
      display: block;

      color: var(--brand);

      font-size: 1.05rem;
      font-weight: 500;
      line-height: 1.35;

      transition: color 0.18s ease;
    }

    .title-en {
      display: block;

      margin-top: 3px;

      color: #9a7e49;

      font-family: "Cormorant Garamond", serif;
      font-size: 1.04rem;
      font-weight: 600;

      letter-spacing: 0.25px;

      transition: color 0.18s ease;
    }

    .btn:hover .title-th {
      color: #fffdf8;
    }

    .btn:hover .title-en {
      color: #e2c994;
    }

    /*
      ปุ่มกลางให้เด่นกว่าปุ่มอื่นเล็กน้อย
      แต่ยัง minimal
    */
    .btn-ingdao {
      background: rgba(66, 82, 23, 0.045);

      border-color: rgba(66, 82, 23, 0.48);
    }

    .btn-ingdao .title-th {
      font-family: "Cormorant Garamond", serif;

      font-size: 1.25rem;
      font-weight: 600;

      letter-spacing: 0.7px;
    }

    .btn-ingdao:hover {
      background: var(--brand);
    }

    /* =========================
       Footer
       ========================= */

    .footer-note {
      position: relative;

      margin-top: 28px;
      padding-top: 20px;

      color: var(--muted);

      font-family: "Cormorant Garamond", serif;
      font-size: 0.94rem;
      font-weight: 500;

      letter-spacing: 0.3px;
    }

    .footer-note::before {
      content: "";

      position: absolute;
      top: 0;
      left: 50%;

      width: 100px;
      height: 1px;

      transform: translateX(-50%);

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--gold),
          transparent
        );
    }

    .footer-note::after {
      content: "";

      position: absolute;
      top: -3px;
      left: 50%;

      width: 7px;
      height: 7px;

      background: var(--gold);

      transform:
        translateX(-50%)
        rotate(45deg);

      box-shadow:
        0 0 0 5px var(--paper);
    }

    /* =========================
       Mobile
       ========================= */

    @media (max-width: 480px) {
      .cell {
        padding: 14px;
      }

      .card {
        padding: 32px 20px 22px;

        border-radius: 23px;
      }

      .card::before {
        inset: 5px;
        border-radius: 18px;
      }

      .logo-img {
        max-width: 190px;
        margin-bottom: 16px;
      }

      .divider {
        width: 72%;
        margin-bottom: 23px;
      }

      .subtitle-th {
        font-size: 0.98rem;
      }

      .subtitle-en {
        margin-bottom: 23px;
        font-size: 0.98rem;
      }

      .btn {
        padding: 15px 15px;
        margin-bottom: 11px;

        border-radius: 14px;
      }

      .title-th {
        font-size: 0.98rem;
      }

      .title-en {
        font-size: 0.97rem;
      }

      .btn-ingdao .title-th {
        font-size: 1.16rem;
      }

      .footer-note {
        margin-top: 23px;
        padding-top: 18px;

        font-size: 0.88rem;
      }
    }

    @media (max-width: 360px) {
      .cell {
        padding: 9px;
      }

      .card {
        padding: 26px 15px 19px;
      }

      .logo-img {
        max-width: 170px;
      }

      .subtitle-en {
        margin-bottom: 19px;
      }

      .btn {
        padding: 13px 12px;
      }
    }
  </style>
</head>

<body>

  <div class="wrapper">
    <div class="cell">

      <div class="card">

        <img
          src="logo.png"
          alt="Estella Khaoyai Logo"
          class="logo-img"
        >

        <div class="divider"></div>

        <p class="subtitle-th">
          กรุณาเลือกเมนูที่ต้องการ
        </p>

        <p class="subtitle-en">
          Please select your preferred menu
        </p>


        <div class="menu-buttons">

          <!-- Food Menu -->
          <a
            class="btn btn-food"
            href="https://z888znokbindai.github.io/est_menu/food"
            id="link-food"
          >
            <span class="title-th">
              เมนูอาหาร อิงดาว
            </span>

            <span class="title-en">
              Ing Dao Food Menu
            </span>
          </a>


          <!-- A La Carte -->
          <a
            class="btn btn-ingdao"
            href="https://z888znokbindai.github.io/est_menu/alc"
            id="link-ingdao"
          >
            <span class="title-th">
              Ing Dao
            </span>

            <span class="title-en">
              A La Carte
            </span>
          </a>


          <!-- Beverage Menu -->
          <a
            class="btn btn-drink"
            href="https://z888znokbindai.github.io/est_menu/drink"
            id="link-drink"
          >
            <span class="title-th">
              เมนูเครื่องดื่ม อิงดาว
            </span>

            <span class="title-en">
              Ing Dao Beverage Menu
            </span>
          </a>

        </div>


        <div class="footer-note">
          Scan once, choose your menu anytime
        </div>

      </div>

    </div>
  </div>


  <script>
    /*
      Reload เมื่อกลับมาจาก Back / Forward
    */
    window.addEventListener('pageshow', function (event) {

      if (
        event.persisted ||
        (
          typeof window.performance !== 'undefined' &&
          window.performance.navigation.type === 2
        )
      ) {
        window.location.reload(true);
      }

    });


    /*
      Cache Buster
    */
    try {

      var timestamp = new Date().getTime();

      var foodLink =
        document.getElementById('link-food');

      var ingdaoLink =
        document.getElementById('link-ingdao');

      var drinkLink =
        document.getElementById('link-drink');


      if (foodLink) {

        foodLink.href =
          "https://z888znokbindai.github.io/est_menu/food?t=" +
          timestamp;

      }


      if (ingdaoLink) {

        ingdaoLink.href =
          "https://z888znokbindai.github.io/est_menu/alc?t=" +
          timestamp;

      }


      if (drinkLink) {

        drinkLink.href =
          "https://z888znokbindai.github.io/est_menu/drink?t=" +
          timestamp;

      }

    } catch (e) {

      console.error(
        "Cache buster error:",
        e
      );

    }
  </script>

</body>
</html>
