<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>SaWaDiKa Happy Hour | Estella Khao Yai</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #f4fcee; }
    body { display: grid; place-items: center; }
    .poster {
      display: block;
      width: 100%;
      max-width: 720px;
      height: auto;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <img
    id="happy-hour-poster"
    class="poster"
    src="sawadika-happy-hour.webp"
    alt="SaWaDiKa at Estella Happy Hour promotion"
  >
  <script>
    document.getElementById("happy-hour-poster").src =
      "sawadika-happy-hour.webp?t=" + Date.now();
  </script>
</body>
</html>
