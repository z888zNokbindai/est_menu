<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>PDF Viewer - No Cache</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --line: #334155;
      --accent: #22c55e;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--line);
    }

    .toolbar-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 16px;
      display: grid;
      gap: 10px;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    input[type="text"], input[type="number"] {
      flex: 1 1 320px;
      min-width: 220px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 10px;
      outline: none;
    }

    input[type="file"] {
      color: var(--muted);
    }

    button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      padding: 12px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      filter: brightness(1.1);
    }

    .primary {
      background: var(--accent);
      color: #052e16;
      border-color: transparent;
    }

    .danger {
      background: var(--danger);
      color: white;
      border-color: transparent;
    }

    .hint, .status {
      color: var(--muted);
      font-size: 14px;
    }

    .status strong {
      color: var(--text);
    }

    .viewer {
      padding: 18px 0 40px;
    }

    .pdf-page {
      background: white;
      margin: 0 auto 16px;
      display: block;
      max-width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      border-radius: 8px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
    }

    .hidden { display: none; }

    .spacer { flex: 0 0 auto; }

    @media (max-width: 700px) {
      .row {
        flex-direction: column;
        align-items: stretch;
      }

      button, input[type="text"], input[type="number"] {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-inner">
      <div class="row">
        <input id="pdfUrl" type="text" placeholder="วางลิงก์ PDF เช่น /files/menu.pdf หรือ https://example.com/menu.pdf" />
        <button id="loadUrlBtn" class="primary">โหลดจาก URL</button>
        <button id="reloadBtn">รีโหลดล่าสุด</button>
      </div>

      <div class="row">
        <input id="fileInput" type="file" accept="application/pdf" />
        <input id="scaleInput" type="number" min="0.5" max="3" step="0.1" value="1.3" />
        <button id="zoomApplyBtn">ใช้ Zoom</button>
        <button id="clearBtn" class="danger">ล้างหน้า</button>
      </div>

      <div class="card">
        <div class="status" id="status">สถานะ: <strong>พร้อมใช้งาน</strong></div>
        <div class="hint">
          หน้าเว็บนี้พยายามไม่ใช้แคชโดยใช้ <strong>fetch(..., { cache: 'no-store' })</strong> และเติม timestamp ทุกครั้งที่โหลดไฟล์จาก URL<br>
          แต่ถ้าต้องการให้ไม่แคชจริง ควรตั้งฝั่งเซิร์ฟเวอร์ของไฟล์ PDF เพิ่มด้วย: <strong>Cache-Control: no-store</strong>
        </div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div id="viewer" class="viewer"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

    const pdfUrlInput = document.getElementById('pdfUrl');
    const fileInput = document.getElementById('fileInput');
    const loadUrlBtn = document.getElementById('loadUrlBtn');
    const reloadBtn = document.getElementById('reloadBtn');
    const clearBtn = document.getElementById('clearBtn');
    const viewer = document.getElementById('viewer');
    const statusEl = document.getElementById('status');
    const scaleInput = document.getElementById('scaleInput');
    const zoomApplyBtn = document.getElementById('zoomApplyBtn');

    let currentPdfDoc = null;
    let currentPdfBytes = null;
    let lastUrl = '';
    let currentScale = 1.3;

    function setStatus(text) {
      statusEl.innerHTML = `สถานะ: <strong>${text}</strong>`;
    }

    function clearViewer() {
      viewer.innerHTML = '';
      if (currentPdfDoc) {
        try {
          currentPdfDoc.destroy();
        } catch (e) {}
      }
      currentPdfDoc = null;
      currentPdfBytes = null;
    }

    function buildNoCacheUrl(url) {
      const u = new URL(url, window.location.href);
      u.searchParams.set('_ts', Date.now().toString());
      return u.toString();
    }

    async function fetchPdfBytes(url) {
      const noCacheUrl = buildNoCacheUrl(url);
      const res = await fetch(noCacheUrl, {
        method: 'GET',
        cache: 'no-store',
        headers: {
          'Cache-Control': 'no-cache, no-store, must-revalidate',
          'Pragma': 'no-cache',
          'Expires': '0'
        }
      });

      if (!res.ok) {
        throw new Error(`โหลด PDF ไม่สำเร็จ (${res.status} ${res.statusText})`);
      }

      return new Uint8Array(await res.arrayBuffer());
    }

    async function renderPdf(bytes, scale = currentScale) {
      clearViewer();
      currentPdfBytes = bytes;
      setStatus('กำลังเปิดไฟล์ PDF...');

      const loadingTask = pdfjsLib.getDocument({ data: bytes });
      const pdf = await loadingTask.promise;
      currentPdfDoc = pdf;

      setStatus(`พบ ${pdf.numPages} หน้า, กำลังเรนเดอร์...`);

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const viewport = page.getViewport({ scale });

        const canvas = document.createElement('canvas');
        canvas.className = 'pdf-page';
        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);

        const ctx = canvas.getContext('2d', { alpha: false });
        await page.render({ canvasContext: ctx, viewport }).promise;

        viewer.appendChild(canvas);
      }

      setStatus(`แสดงผลสำเร็จ ${pdf.numPages} หน้า | Zoom ${scale}x`);
    }

    async function loadFromUrl() {
      const rawUrl = pdfUrlInput.value.trim();
      if (!rawUrl) {
        setStatus('กรุณาใส่ URL ของ PDF');
        return;
      }

      try {
        lastUrl = rawUrl;
        setStatus('กำลังโหลด PDF จาก URL แบบไม่ใช้แคช...');
        const bytes = await fetchPdfBytes(rawUrl);
        await renderPdf(bytes);
      } catch (err) {
        console.error(err);
        setStatus(`ผิดพลาด: ${err.message}`);
      }
    }

    async function reloadLatest() {
      if (!lastUrl) {
        setStatus('ยังไม่มี URL ล่าสุดให้รีโหลด');
        return;
      }

      try {
        setStatus('กำลังรีโหลดไฟล์ล่าสุดแบบ no-cache...');
        const bytes = await fetchPdfBytes(lastUrl);
        await renderPdf(bytes);
      } catch (err) {
        console.error(err);
        setStatus(`ผิดพลาด: ${err.message}`);
      }
    }

    async function loadFromFile(file) {
      if (!file) return;
      try {
        setStatus(`กำลังโหลดไฟล์ ${file.name} ...`);
        lastUrl = '';
        const bytes = new Uint8Array(await file.arrayBuffer());
        await renderPdf(bytes);
      } catch (err) {
        console.error(err);
        setStatus(`ผิดพลาด: ${err.message}`);
      }
    }

    async function applyZoom() {
      const value = Number(scaleInput.value);
      if (!Number.isFinite(value) || value < 0.5 || value > 3) {
        setStatus('Zoom ต้องอยู่ระหว่าง 0.5 ถึง 3');
        return;
      }

      currentScale = value;
      if (currentPdfBytes) {
        try {
          setStatus(`กำลังเรนเดอร์ใหม่ที่ Zoom ${currentScale}x ...`);
          await renderPdf(currentPdfBytes, currentScale);
        } catch (err) {
          console.error(err);
          setStatus(`ผิดพลาด: ${err.message}`);
        }
      } else {
        setStatus(`ตั้งค่า Zoom เป็น ${currentScale}x แล้ว`);
      }
    }

    loadUrlBtn.addEventListener('click', loadFromUrl);
    reloadBtn.addEventListener('click', reloadLatest);
    zoomApplyBtn.addEventListener('click', applyZoom);

    clearBtn.addEventListener('click', () => {
      clearViewer();
      fileInput.value = '';
      setStatus('ล้างหน้าเรียบร้อย');
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      loadFromFile(file);
    });

    pdfUrlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadFromUrl();
    });

    scaleInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') applyZoom();
    });
  </script>
</body>
</html>
